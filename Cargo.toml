[package]
name = "zone-scan"
version = "0.3.0"
edition = "2021"
description = "Sequencer-agnostic L1 observer for LEZ sequencers - CLI + live web dashboard, reads only public on-chain settlement data"
license = "GPL-3.0-or-later"

[[bin]]
name = "zone-scan"
path = "src/main.rs"

[features]
default = []
# Full per-block tx-type mix (Public / PrivacyPreserving / ProgramDeployment).
# Pulls `common` (and transitively `nssa`), so it is opt-in to keep the default
# build lightweight: `cargo build --features decode`.
decode = ["dep:common", "dep:borsh", "dep:nssa", "dep:sha2"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
hex = "0.4"
chrono = "0.4"
axum = "0.7"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
redb = "4"
bincode = "1.3"

# decode build pinned to the v0.2.0-rc4 tag - the build the live rc4 sequencers
# (0505 / 0606 / 0707) run, so block hashes recompute and program image ids match.
# Its common/nssa are byte-identical to the align-logos-0.1.2 branch commit we used to
# pin; a tag (unlike a branch commit, which got GC'd) stays fetchable from a fresh clone.
common = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc4", optional = true }
nssa = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc4", optional = true }
borsh = { version = "1.5", optional = true }
sha2 = { version = "0.10", optional = true }
