[package]
name = "zone-scan"
version = "0.5.0"
edition = "2021"
description = "Sequencer-agnostic L1 observer for LEZ sequencers - CLI + live web dashboard, reads only public on-chain settlement data"
license = "GPL-3.0-or-later"

[[bin]]
name = "zone-scan"
path = "src/main.rs"

[features]
default = []
# Full per-block tx-type mix (Public / PrivacyPreserving / ProgramDeployment).
# Pulls `common` (and transitively `nssa`), so it is opt-in to keep the default
# build lightweight: `cargo build --features decode`.
decode = ["dep:common", "dep:borsh", "dep:lee", "dep:sha2", "dep:programs"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
hex = "0.4"
chrono = "0.4"
axum = "0.7"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
redb = "4"
bincode = "1.3"

# decode build pinned to the v0.2.0-rc5 tag - the version the live sequencers run (they
# self-report `rc5`). rc5 restructured the workspace: the program/state-machine crate `nssa`
# became `lee`, and `common` moved under lez/ (its cargo package NAME is unchanged, so the git
# dep still resolves as `common`). The decoder needs only `common` + `lee`; the built-in program
# image ids come from lee's build-generated `program_methods` (so the build needs the risc0 guest
# toolchain - cargo-risczero/r0vm - which CI installs). A tag (not a branch commit, which can be
# GC'd) stays fetchable from a fresh clone / CI.
common = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0", optional = true }
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0", optional = true }
# v0.2.0 moved the built-in Program constructors out of `lee` into this crate; the
# `artifacts` feature embeds the prebuilt guest binaries so their image ids resolve.
programs = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0", features = ["artifacts"], optional = true }
borsh = { version = "1.5", optional = true }
sha2 = { version = "0.10", optional = true }
