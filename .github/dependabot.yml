version: 2
updates:
  # Keep the release CI's third-party actions current (and pinnable). Pin each
  # action to a full commit SHA in release.yml; Dependabot then bumps the SHA and
  # annotates the version, so a moved tag can't silently re-point the pipeline.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
